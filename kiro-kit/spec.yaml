schemaVersion: "1"
kind: sandbox
name: di-kiro
displayName: di-kiro
description: Kiro set up for a One Login user.

sandbox:
  image: "docker/sandbox-templates:kiro-docker"
  entrypoint:
    run:
      - "/bin/sh"
      - "-c"
      - >-
        kiro-cli whoami 2>/dev/null ||
        kiro-cli login --license pro
        --identity-provider https://uk-digital-identity.awsapps.com/start/
        --region eu-west-2
        --use-device-flow;
        exec kiro

environment:
  variables:
    AWS_DOCUMENTATION_PARTITION: "aws"

commands:
  install:
    - command: pip install uv --break-system-packages
    - command: >-
        echo 'kiro-cli settings telemetry.enabled false'
        >> /etc/sandbox-persistent.sh
  startup:
    - command: ["/bin/sh", "-c", "cp -r /home/agent/kiro-kit/shared/.kiro/. /home/agent/.kiro/"]
      user: "1000"
      description: "Copy shared Kiro config to ~/.kiro"
    # The kiro image sets NPM_CONFIG_PREFIX to a dir whose lib/ is missing;
    # create it so npx can unpack the Agent Manager CLI (the agent owns the
    # dir, so no root needed).
    - command: ["/bin/sh", "-c", "mkdir -p \"${NPM_CONFIG_PREFIX:-/usr/local/share/npm-global}/lib\" \"${NPM_CONFIG_PREFIX:-/usr/local/share/npm-global}/bin\"; npx -y @ai-agent-manager/cli@latest govuk-one-login/agent-skills --config /home/agent/kiro-kit/shared/ai-skills.yml"]
      user: "1000"
      description: "Install shared agent skills from govuk-one-login/agent-skills"
    - command: ["/bin/sh", "-c", "if [ -d /home/agent/kiro-kit/personal/.kiro ]; then cp -r /home/agent/kiro-kit/personal/.kiro/. /home/agent/.kiro/; fi"]
      user: "1000"
      description: "Overlay personal Kiro config on top of shared"

caps:
  network:
    allow:
      - "cognito-identity.eu-central-1.amazonaws.com:443"
      - "oidc.eu-west-2.amazonaws.com:443"
      - "eu-west-2.signin.aws:443"
      - "uk-digital-identity.awsapps.com:443"
      - "management.eu-central-1.kiro.dev:443"
      - "runtime.eu-central-1.kiro.dev:443"
      - "**.docs.aws.amazon.com:443"
      - "**.docs.aws.com:443"
      - "pypi.org:443"
      - "files.pythonhosted.org:443"
      - "docs.docker.com:443"
      - "kiro.dev:443"
      - "registry.npmjs.org:443"
      # Agent skills: Agent Manager downloads the discovery document
      # (archive + Contents API) and clones skill source repositories.
      # See files/home/kiro-kit/shared/ai-skills.yml.
      - "api.github.com:443"
      - "codeload.github.com:443"
      - "raw.githubusercontent.com:443"
      # Gradle and Gradle plugins
      - "gradle.org:443"
      - "services.gradle.org:443"
      - "github.com:443"
      - "release-assets.githubusercontent.com:443"
      - "plugins.gradle.org:443"
      - "plugins-artifacts.gradle.org:443"
      # Java dependencies
      - "repo.maven.apache.org:443"
      - "repo.danubetech.com:443"
      - "registry.terraform.io/providers/hashicorp/aws/latest/docs:443" 
